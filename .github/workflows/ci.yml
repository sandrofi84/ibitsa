# CI (spec §13): every PR and push to main. Ubuntu runs everything; macOS and Windows run the unit and
# integration tests (sandbox and platform behaviour, §11.6). Platform packaging and publishing at M10.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: File conventions
        run: pnpm conventions

      - name: Lint and format (Biome)
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Unit tests, fixture golden files and coverage floors (Vitest)
        run: pnpm exec vitest run --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build extension and game
        run: pnpm -r build

      - name: Install Playwright browser
        run: pnpm --filter @ibitsa/game exec playwright install --with-deps chromium

      - name: End-to-end tests against the standalone game (Playwright)
        run: pnpm --filter @ibitsa/game test:e2e

      - name: Extension integration tests (VS Code under xvfb)
        working-directory: packages/extension
        run: xvfb-run -a -s "-screen 0 1920x1080x24" pnpm test:integration

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: packages/game/test-results/
          if-no-files-found: ignore

  platforms:
    # Unit and integration tests where hero sessions behave differently: the Seatbelt sandbox on macOS,
    # no sandbox on native Windows. Coverage floors and Playwright run on Ubuntu only.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Unit tests and fixture golden files (Vitest)
        run: pnpm exec vitest run

      - name: Build extension and game
        run: pnpm -r build

      - name: Extension integration tests (VS Code)
        working-directory: packages/extension
        run: pnpm test:integration
